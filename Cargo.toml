[package]
name = "chain-reaction"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# Web server & WebSocket
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
tokio-tungstenite = "0.21"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async utilities
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID & random
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Concurrent collections
dashmap = "5.5"

# Time
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
